; SmartRO purifier valve firmware, ESP32 DevKit V1 (30-pin).
;
; Two builds. Pick one in the PlatformIO sidebar under smartro_valve:
;   env:lan         the backend runs on your PC, on the same Wi-Fi. For testing.
;   env:production  the live server, over HTTPS. For purifiers going to customers.
;
; Upload:  smartro_valve -> env:lan -> Upload, then Monitor.

[platformio]
default_envs = lan

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_echo = yes
monitor_filters = esp32_exception_decoder
; Wi-Fi + HTTPS + web server don't fit the default 1.25 MB app slot.
; min_spiffs: two 1.9 MB app slots (one runs, the other takes remote updates), NVS unchanged.
board_build.partitions = min_spiffs.csv
lib_deps =
    bblanchon/ArduinoJson@^7.3.0
build_flags =
    ; Bump for every release. The purifier sends it with each server check; the server offers releases that differ (OTA.md).
    -D FW_VERSION=\"1.1.0\"
    ; 0: the relay clicks ON when IN is HIGH (what relay_test showed with RELAY_ON = HIGH).
    ; 1: the relay clicks ON when IN is LOW. Use this if relay_test needed the swap.
    -D RELAY_ACTIVE_LOW=0

[env:lan]
build_flags =
    ${env.build_flags}
    ; Your PC's Wi-Fi address and the backend port. Find it with `ipconfig`
    ; (IPv4 Address under "Wireless LAN adapter Wi-Fi"). It was 192.168.1.10
    ; on 2026-11-03; it can change when the router restarts.
    -D API_BASE=\"http://192.168.1.10:4000/api/v1\"

[env:production]
build_flags =
    ${env.build_flags}
    -D API_BASE=\"https://srv2122898.hstgr.cloud/api/v1\"
    -D REQUIRE_HTTPS=1
