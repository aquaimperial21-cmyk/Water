<span class="material-symbols-outlined text-on-primary mb-sm" style="font-variation-settings: 'FILL' 1; font-size: 48px;">water_drop</span>

<p class="font-body-lg text-body-lg text-primary-fixed mt-xs">Clean water as a service.</p>

<!-- Main Content Canvas -->
<main class="flex-1 px-margin -mt-xl relative z-20 flex flex-col pb-margin w-full max-w-md mx-auto">
<!-- Login Card -->
<div class="bg-surface-container-lowest rounded-xl shadow-lg shadow-tertiary-container/10 p-lg w-full ring-1 ring-outline-variant/20">
<div class="mb-lg">
<h2 class="font-headline-md text-headline-md text-on-surface">Welcome</h2>
<p class="font-body-md text-body-md text-on-surface-variant mt-xs">Enter your mobile number to begin.</p>
</div>
<form action="#" class="flex flex-col gap-xl" method="POST">
<!-- Phone Number Input -->
<div class="flex flex-col gap-sm">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider" for="phone">Phone Number</label>
<div class="flex items-center w-full bg-surface border border-outline-variant rounded-lg overflow-hidden focus-within:border-primary focus-within:ring-1 focus-within:ring-primary transition-all duration-200 shadow-sm">
<div class="bg-surface-container-low px-md py-md border-r border-outline-variant flex items-center justify-center">
<span class="font-label-md text-label-md text-on-surface">+91</span>
</div>
<input autocomplete="tel" class="flex-1 w-full bg-transparent border-none px-md py-md font-body-md text-body-md text-on-surface placeholder:text-outline focus:ring-0 focus:outline-none h-full" id="phone" name="phone" placeholder="00000 00000" type="tel"/>
</div>
</div>
<!-- Primary Action Button -->
<button class="w-full bg-primary hover:bg-on-primary-fixed-variant text-on-primary font-label-md text-label-md py-md px-lg rounded-lg flex items-center justify-center gap-sm transition-colors duration-200 shadow-sm shadow-primary/20" type="submit">
                    Send OTP
                    <span class="material-symbols-outlined" style="font-size: 20px;">arrow_forward</span>
</button>
</form>
</div>
<!-- Footer Text -->
<div class="mt-auto pt-xl text-center px-md">
<p class="font-body-md text-body-md text-on-surface-variant text-[13px] leading-relaxed">
