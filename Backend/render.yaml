# Render.com blueprint for the SmartRO backend (free-tier testing).
#
# Deploy via:
#   1. Push this repo to GitHub.
#   2. Go to https://dashboard.render.com → New → Blueprint → pick repo.
#   3. Render will read this file and prompt for the env-vars marked sync:false.
#   4. Paste your Neon DATABASE_URL when prompted; the JWT secrets auto-generate.
#
# Free-tier notes:
#   • Service sleeps after 15 min idle, ~30 s cold start on first request.
#   • No persistent disk on free tier → /uploads files lost on redeploy
#     (fine for testing; switch to S3/R2 for real).
#   • The schema is applied with `prisma migrate deploy` from prisma/migrations.
#     It runs only migrations the database has not had yet and never drops
#     data on its own. (`db push` was used before the migrations folder existed;
#     it can't add the required Plan.durationMonths column to a filled table.)
#   • DB first created by `db push`? Baseline it ONCE from your laptop, marking
#     only the migrations it already has as applied, then redeploy:
#       DATABASE_URL="<your-neon-url>" npx prisma migrate resolve --applied 0_init
#       DATABASE_URL="<your-neon-url>" npx prisma migrate resolve --applied 20260916190000_payment_refs_and_invoice_sequence
#     Leave 20261102160000_plan_duration_months (and anything newer) for
#     `migrate deploy` to run.

services:
  - type: web
    name: smartro-api
    runtime: node
    plan: free
    region: singapore
    rootDir: Backend
    buildCommand: npm install && npx prisma generate && npm run build && npx prisma migrate deploy
    # ↑ applies pending prisma/migrations; fails the build (keeping the old
    #   version live) if a migration fails. See the baseline note above.
    # After the first deploy succeeds, seed the database ONCE from your laptop:
    #   cd Backend
    #   DATABASE_URL="<your-neon-url>" npx tsx prisma/seed.ts
    # Re-running the seed wipes and recreates all test data.
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        sync: false                 # paste your Neon pooled connection string
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL_SECONDS
        value: 900
      - key: JWT_REFRESH_TTL_SECONDS
        value: 2592000
      - key: OTP_TTL_SECONDS
        value: 300
      - key: OTP_DEV_RETURN
        value: "false"              # true echoes OTPs to callers; env.ts refuses to boot on it
      - key: MESSAGING_DRIVER
        value: stub
      - key: PAYMENT_DRIVER
        value: stub
      - key: PAYMENT_STUB_DELAY_MS
        value: 1500
      - key: PUSH_DRIVER
        value: stub
      # Phone login cannot verify tokens without this; env.ts refuses to boot.
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: CORS_ORIGINS
        sync: false                 # set to the admin console origin; "*" refuses to boot
      - key: TRIAL_DAYS
        value: 7
      - key: INSTALL_LEAD_HOURS
        value: 6
      - key: REFERRAL_REWARD_PAISE
        value: 20000
