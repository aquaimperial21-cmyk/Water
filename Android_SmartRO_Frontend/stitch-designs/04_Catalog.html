<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>New Ticket - PureFlow</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-tertiary-fixed-variant": "#763125",
                        "surface-variant": "#dfe3e0",
                        "on-error-container": "#93000a",
                        "outline-variant": "#bdc9c4",
                        "primary-fixed-dim": "#7bd7bd",
                        "inverse-on-surface": "#eef2ee",
                        "surface-dim": "#d7dbd8",
                        "on-background": "#181d1b",
                        "outline": "#6e7a75",
                        "on-surface-variant": "#3e4945",
                        "on-tertiary": "#ffffff",
                        "on-error": "#ffffff",
                        "tertiary-fixed": "#ffdad3",
                        "on-primary-fixed": "#002019",
                        "on-primary": "#ffffff",
                        "background": "#f6faf7",
                        "on-secondary-fixed-variant": "#00458f",
                        "surface-bright": "#f6faf7",
                        "primary-fixed": "#97f4d9",
                        "surface": "#f6faf7",
                        "on-secondary-fixed": "#001b3f",
                        "on-primary-fixed-variant": "#005141",
                        "tertiary-fixed-dim": "#ffb4a6",
                        "primary-container": "#0e7c66",
                        "surface-container-low": "#f0f5f1",
                        "tertiary-container": "#a75748",
                        "surface-container": "#ebefeb",
                        "on-tertiary-container": "#ffeeea",
                        "secondary-fixed-dim": "#abc7ff",
                        "secondary-fixed": "#d7e2ff",
                        "secondary-container": "#4c92fe",
                        "surface-tint": "#006b57",
                        "error": "#ba1a1a",
                        "on-tertiary-fixed": "#3d0702",
                        "surface-container-high": "#e5e9e6",
                        "on-secondary-container": "#002b5e",
                        "inverse-primary": "#7bd7bd",
                        "primary": "#00614f",
                        "tertiary": "#894032",
                        "surface-container-highest": "#dfe3e0",
                        "surface-container-lowest": "#ffffff",
                        "inverse-surface": "#2d312f",
                        "on-surface": "#181d1b",
                        "on-secondary": "#ffffff",
                        "on-primary-container": "#bcffe9",
                        "secondary": "#005cbb",
                        "error-container": "#ffdad6"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "sm": "8px",
                        "md": "12px",
                        "xs": "4px",
                        "lg": "16px",
                        "xl": "24px",
                        "xxl": "32px"
                    },
                    "fontFamily": {
                        "body": ["Inter"],
                        "h1": ["Inter"],
                        "h2": ["Inter"],
                        "h3": ["Inter"],
                        "small": ["Inter"]
                    },
                    "fontSize": {
                        "body": ["14px", {"lineHeight": "1.5", "fontWeight": "400"}],
                        "h1": ["26px", {"lineHeight": "1.2", "fontWeight": "700"}],
                        "h2": ["20px", {"lineHeight": "1.3", "fontWeight": "700"}],
                        "h3": ["16px", {"lineHeight": "1.4", "fontWeight": "600"}],
                        "small": ["12px", {"lineHeight": "1.5", "fontWeight": "400"}]
                    }
                }
            }
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface font-body font-body antialiased selection:bg-primary-container selection:text-on-primary-container h-screen flex flex-col overflow-hidden">
<!-- TopAppBar -->
<header class="bg-white dark:bg-slate-900 sticky full-width top-0 border-b border-gray-200 dark:border-gray-800 z-40 flex justify-between items-center w-full px-4 h-16 transition-colors duration-200">
<div class="flex items-center gap-3">
<!-- Back button (Task-focused intent) -->
<button class="text-teal-700 dark:text-teal-400 hover:bg-teal-50 dark:hover:bg-teal-900/30 p-2 rounded-full flex items-center justify-center transition-colors duration-200">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="text-teal-700 dark:text-teal-400 font-sans text-lg font-bold tracking-tight">New Ticket</h1>
</div>
<div class="flex items-center">
<!-- Top Nav Hidden on Mobile, Shown on Desktop if it was a destination, but it's a task -->
</div>
</header>
<!-- Main Content Area -->
<main class="flex-1 overflow-y-auto px-4 py-xl pb-[100px] lg:px-xxl max-w-4xl mx-auto w-full">
<form class="flex flex-col gap-xl">
<!-- Category Section -->
<section class="flex flex-col gap-md">
<h2 class="font-h3 text-h3 text-on-surface">Category</h2>
<div class="flex flex-wrap gap-sm">
<button class="px-lg py-sm rounded-full bg-primary-container text-on-primary font-small text-small border border-primary-container transition-colors focus:ring-2 focus:ring-primary-container focus:outline-none" type="button">Plumbing</button>
<button class="px-lg py-sm rounded-full bg-surface-container-lowest text-on-surface-variant font-small text-small border border-outline-variant hover:bg-surface-container-low transition-colors focus:ring-2 focus:ring-primary-container focus:outline-none" type="button">Electrical</button>
<button class="px-lg py-sm rounded-full bg-surface-container-lowest text-on-surface-variant font-small text-small border border-outline-variant hover:bg-surface-container-low transition-colors focus:ring-2 focus:ring-primary-container focus:outline-none" type="button">HVAC</button>
<button class="px-lg py-sm rounded-full bg-surface-container-lowest text-on-surface-variant font-small text-small border border-outline-variant hover:bg-surface-container-low transition-colors focus:ring-2 focus:ring-primary-container focus:outline-none" type="button">General</button>
</div>
</section>
<!-- Priority Section -->
<section class="flex flex-col gap-md">
<h2 class="font-h3 text-h3 text-on-surface">Priority</h2>
<div class="flex flex-wrap gap-sm">
<button class="px-lg py-sm rounded-full bg-surface-container-lowest text-on-surface-variant font-small text-small border border-outline-variant hover:bg-surface-container-low transition-colors flex items-center gap-2 focus:ring-2 focus:ring-primary-container focus:outline-none" type="button">
<span class="material-symbols-outlined text-[16px]" data-icon="low_priority">low_priority</span> Low
                    </button>
<button class="px-lg py-sm rounded-full bg-surface-container-lowest text-on-surface-variant font-small text-small border border-outline-variant hover:bg-surface-container-low transition-colors flex items-center gap-2 focus:ring-2 focus:ring-primary-container focus:outline-none" type="button">
<span class="material-symbols-outlined text-[16px]" data-icon="priority">priority</span> Medium
                    </button>
<button class="px-lg py-sm rounded-full bg-error text-on-error font-small text-small border border-error transition-colors flex items-center gap-2 focus:ring-2 focus:ring-error focus:outline-none" type="button">
<span class="material-symbols-outlined text-[16px]" data-icon="priority_high">priority_high</span> High
                    </button>
</div>
</section>
<!-- Issue Description Section -->
<section class="flex flex-col gap-md">
<h2 class="font-h3 text-h3 text-on-surface">What's the issue?</h2>
<textarea class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg p-md font-body text-body text-on-surface placeholder:text-on-surface-variant/50 focus:border-primary-container focus:ring-1 focus:ring-primary-container focus:outline-none resize-none transition-colors" placeholder="Describe the problem in detail..." rows="5"></textarea>
</section>
<!-- Photo Upload Section -->
<section class="flex flex-col gap-md">
<h2 class="font-h3 text-h3 text-on-surface">Photos</h2>
<div class="grid grid-cols-3 md:grid-cols-4 gap-sm">
<!-- Upload Button -->
<button class="aspect-square bg-surface-container-low border border-dashed border-outline rounded-lg flex flex-col items-center justify-center gap-2 text-on-surface-variant hover:bg-surface-container transition-colors focus:ring-2 focus:ring-primary-container focus:outline-none" type="button">
<span class="material-symbols-outlined text-[24px]" data-icon="add_a_photo">add_a_photo</span>
<span class="font-small text-small">Add</span>
</button>
<!-- Placeholder Thumbnails (Simulating uploaded images) -->
<div class="aspect-square bg-surface-container-highest rounded-lg border border-outline-variant overflow-hidden relative group">
<div class="w-full h-full bg-gradient-to-br from-surface-variant to-outline-variant opacity-50"></div>
<button class="absolute top-1 right-1 bg-surface-container-lowest/80 text-on-surface rounded-full p-1 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity" type="button">
<span class="material-symbols-outlined text-[14px]" data-icon="close">close</span>
</button>
</div>
</div>
<p class="font-small text-small text-on-surface-variant">Attach up to 4 photos to help us understand the issue.</p>
</section>
</form>
</main>
<!-- Sticky Submit Button -->
<div class="fixed bottom-0 left-0 w-full bg-surface border-t border-outline-variant p-4 lg:px-xxl flex justify-center z-50">
<button class="w-full max-w-4xl bg-primary-container text-on-primary font-h3 text-h3 py-md rounded-lg hover:bg-primary transition-colors focus:ring-2 focus:ring-offset-2 focus:ring-primary-container focus:outline-none shadow-sm" type="submit">
            Submit ticket
        </button>
</div>
<!-- Navigation suppressed as this is a task-focused screen (creating a new ticket) -->
</body></html>
