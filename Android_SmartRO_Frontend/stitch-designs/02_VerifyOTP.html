<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Verify your number</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
  .material-symbols-outlined {
    font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
  }
</style>
<script id="tailwind-config">
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        "colors": {
                "on-tertiary-fixed-variant": "#763125",
                "surface-variant": "#dfe3e0",
                "on-error-container": "#93000a",
                "outline-variant": "#bdc9c4",
                "primary-fixed-dim": "#7bd7bd",
                "inverse-on-surface": "#eef2ee",
                "surface-dim": "#d7dbd8",
                "on-background": "#181d1b",
                "outline": "#6e7a75",
                "on-surface-variant": "#3e4945",
                "on-tertiary": "#ffffff",
                "on-error": "#ffffff",
                "tertiary-fixed": "#ffdad3",
                "on-primary-fixed": "#002019",
                "on-primary": "#ffffff",
                "background": "#f6faf7",
                "on-secondary-fixed-variant": "#00458f",
                "surface-bright": "#f6faf7",
                "primary-fixed": "#97f4d9",
                "surface": "#f6faf7",
                "on-secondary-fixed": "#001b3f",
                "on-primary-fixed-variant": "#005141",
                "tertiary-fixed-dim": "#ffb4a6",
                "primary-container": "#0e7c66",
                "surface-container-low": "#f0f5f1",
                "tertiary-container": "#a75748",
                "surface-container": "#ebefeb",
                "on-tertiary-container": "#ffeeea",
                "secondary-fixed-dim": "#abc7ff",
                "secondary-fixed": "#d7e2ff",
                "secondary-container": "#4c92fe",
                "surface-tint": "#006b57",
                "error": "#ba1a1a",
                "on-tertiary-fixed": "#3d0702",
                "surface-container-high": "#e5e9e6",
                "on-secondary-container": "#002b5e",
                "inverse-primary": "#7bd7bd",
                "primary": "#00614f",
                "tertiary": "#894032",
                "surface-container-highest": "#dfe3e0",
                "surface-container-lowest": "#ffffff",
                "inverse-surface": "#2d312f",
                "on-surface": "#181d1b",
                "on-secondary": "#ffffff",
                "on-primary-container": "#bcffe9",
                "secondary": "#005cbb",
                "error-container": "#ffdad6"
        },
        "borderRadius": {
                "DEFAULT": "0.25rem",
                "lg": "0.5rem",
                "xl": "0.75rem",
                "full": "9999px"
        },
        "spacing": {
                "sm": "8px",
                "md": "12px",
                "xs": "4px",
                "lg": "16px",
                "xl": "24px",
                "xxl": "32px"
        },
        "fontFamily": {
                "body": [
                        "Inter"
                ],
                "h1": [
                        "Inter"
                ],
                "h2": [
                        "Inter"
                ],
                "h3": [
                        "Inter"
                ],
                "small": [
                        "Inter"
                ]
        },
        "fontSize": {
                "body": [
                        "14px",
                        {
                                "lineHeight": "1.5",
                                "fontWeight": "400"
                        }
                ],
                "h1": [
                        "26px",
                        {
                                "lineHeight": "1.2",
                                "fontWeight": "700"
                        }
                ],
                "h2": [
                        "20px",
                        {
                                "lineHeight": "1.3",
                                "fontWeight": "700"
                        }
                ],
                "h3": [
                        "16px",
                        {
                                "lineHeight": "1.4",
                                "fontWeight": "600"
                        }

                "small": [
                        "12px",
                        {
                                "lineHeight": "1.5",
                                "fontWeight": "400"
                        }
                ]
        }
},
    },
  }

<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface-container-lowest min-h-screen text-on-surface antialiased font-body flex items-center justify-center p-xl">
<div class="w-full max-w-[400px] flex flex-col">
<!-- Header (Back Action) -->
<div class="flex items-center w-full mb-xl">
<button class="text-on-surface-variant hover:text-on-surface transition-colors p-xs -ml-xs rounded focus:outline-none focus:ring-2 focus:ring-primary-container">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
</div>
<!-- Title & Subtitle -->
<div class="flex flex-col gap-sm mb-xl">
<h1 class="font-h1 text-h1 text-on-surface tracking-tight">Verify your number</h1>
<p class="font-body text-body text-on-surface-variant">We sent a 6-digit code to +91 98765 43210</p>
</div>
<!-- OTP Input -->
<div class="flex gap-sm justify-between mb-xxl">
<input class="w-12 h-14 text-center font-h2 text-h2 text-on-surface border border-outline-variant rounded bg-surface-container-lowest focus:border-primary-container focus:ring-1 focus:ring-primary-container outline-none transition-colors" inputmode="numeric" maxlength="1" type="text" value="4"/>
<input class="w-12 h-14 text-center font-h2 text-h2 text-on-surface border border-outline-variant rounded bg-surface-container-lowest focus:border-primary-container focus:ring-1 focus:ring-primary-container outline-none transition-colors" inputmode="numeric" maxlength="1" type="text" value="8"/>
<input class="w-12 h-14 text-center font-h2 text-h2 text-on-surface border border-outline-variant rounded bg-surface-container-lowest focus:border-primary-container focus:ring-1 focus:ring-primary-container outline-none transition-colors" inputmode="numeric" maxlength="1" type="text" value=""/>
<input class="w-12 h-14 text-center font-h2 text-h2 text-on-surface border border-outline-variant rounded bg-surface-container-lowest focus:border-primary-container focus:ring-1 focus:ring-primary-container outline-none transition-colors" inputmode="numeric" maxlength="1" type="text" value=""/>
<input class="w-12 h-14 text-center font-h2 text-h2 text-on-surface border border-outline-variant rounded bg-surface-container-lowest focus:border-primary-container focus:ring-1 focus:ring-primary-container outline-none transition-colors" inputmode="numeric" maxlength="1" type="text" value=""/>
<input class="w-12 h-14 text-center font-h2 text-h2 text-on-surface border border-outline-variant rounded bg-surface-container-lowest focus:border-primary-container focus:ring-1 focus:ring-primary-container outline-none transition-colors" inputmode="numeric" maxlength="1" type="text" value=""/>
</div>
<!-- First-time user fields -->
<div class="flex flex-col gap-lg border-t border-surface-variant pt-xl mb-xxl">
<h2 class="font-h3 text-h3 text-on-surface">Complete your profile</h2>
<div class="flex flex-col gap-xs">
<label class="font-small text-small text-on-surface-variant" for="fullName">Full Name</label>
<input class="w-full border border-outline-variant rounded px-md py-sm font-body text-body text-on-surface bg-surface-container-lowest focus:border-primary-container focus:ring-1 focus:ring-primary-container outline-none transition-colors placeholder:text-outline-variant" id="fullName" placeholder="Enter your full name" type="text"/>
</div>
<div class="flex flex-col gap-xs">
<label class="font-small text-small text-on-surface-variant" for="email">Email Address</label>
<input class="w-full border border-outline-variant rounded px-md py-sm font-body text-body text-on-surface bg-surface-container-lowest focus:border-primary-container focus:ring-1 focus:ring-primary-container outline-none transition-colors placeholder:text-outline-variant" id="email" placeholder="Enter your email" type="email"/>
</div>
</div>
<!-- Actions -->
<div class="flex flex-col gap-lg items-center">
<button class="w-full bg-primary-container text-on-primary font-h3 text-h3 py-[14px] px-lg rounded hover:bg-[#0b6352] transition-colors focus:outline-none focus:ring-2 focus:ring-primary-container focus:ring-offset-2 focus:ring-offset-surface-container-lowest">
                Verify &amp; continue
            </button>
<button class="font-body text-body text-primary-container hover:text-primary transition-colors focus:outline-none underline-offset-4 hover:underline">
                Resend OTP
            </button>
</div>
</div>
</body></html>
