<body class="bg-background text-on-background min-h-screen pb-32">
<!-- TopAppBar (Transactional - Nav Shell Suppressed per Guidelines, but keeping header for back navigation) -->
<header class="fixed top-0 w-full z-50 bg-white/70 backdrop-blur-lg border-b border-white/20 shadow-[0_4px_20px_rgba(0,51,102,0.08)]">
<div class="flex justify-between items-center w-full px-6 py-4">
<button class="text-primary hover:bg-sky-50 transition-colors p-2 rounded-full -ml-2 active:scale-95 duration-200">
<span class="material-symbols-outlined text-2xl">arrow_back</span>
</button>
<h1 class="text-xl font-extrabold text-sky-600 tracking-tight font-headline-md text-headline-md">New Ticket</h1>
<div class="w-10"></div> <!-- Spacer for balance -->
</div>
</header>
<main class="pt-[80px] px-6 max-w-2xl mx-auto">
<div class="mb-8 mt-4">
<h2 class="font-headline-lg text-headline-lg text-on-background mb-2">What's the issue?</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Provide details to help our team resolve the problem quickly.</p>
</div>
<form class="space-y-8">
<!-- Category Selection -->
<section>
<h3 class="font-label-md text-label-md text-on-surface mb-3">Category</h3>
<div class="flex flex-wrap gap-3">
<button class="px-4 py-2 rounded-full border border-primary text-primary bg-primary/10 font-label-md text-label-md transition-all" type="button">Plumbing</button>
<button class="px-4 py-2 rounded-full border border-outline-variant text-on-surface-variant hover:bg-surface-container transition-all font-label-md text-label-md" type="button">Electrical</button>
<button class="px-4 py-2 rounded-full border border-outline-variant text-on-surface-variant hover:bg-surface-container transition-all font-label-md text-label-md" type="button">HVAC</button>
<button class="px-4 py-2 rounded-full border border-outline-variant text-on-surface-variant hover:bg-surface-container transition-all font-label-md text-label-md" type="button">General</button>
</div>
</section>
<!-- Priority Selection -->
<section>
<h3 class="font-label-md text-label-md text-on-surface mb-3">Priority</h3>
<div class="flex gap-3">
<button class="flex-1 py-2 rounded-full border border-outline-variant text-on-surface-variant hover:bg-surface-container transition-all font-label-md text-label-md" type="button">Low</button>
<button class="flex-1 py-2 rounded-full border border-secondary text-secondary bg-secondary/10 font-label-md text-label-md transition-all" type="button">Medium</button>
<button class="flex-1 py-2 rounded-full border border-outline-variant text-on-surface-variant hover:bg-surface-container transition-all font-label-md text-label-md" type="button">High</button>
</div>
</section>
<!-- Description Textarea -->
<section>
<label class="font-label-md text-label-md text-on-surface mb-2 block" for="description">Description</label>
<textarea class="w-full bg-surface-container-lowest border border-outline-variant rounded-xl p-4 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors resize-none shadow-[0_4px_20px_rgba(0,51,102,0.03)]" id="description" placeholder="Describe the issue in detail..." rows="5"></textarea>
</section>
<!-- Add Photos -->
<section>
<h3 class="font-label-md text-label-md text-on-surface mb-3 block">Add photos</h3>
<div class="grid grid-cols-3 gap-4">
<button class="aspect-square rounded-xl border-2 border-dashed border-outline-variant bg-surface-container-low flex flex-col items-center justify-center text-primary hover:bg-surface-container transition-colors" type="button">
<span class="material-symbols-outlined text-3xl mb-1">add_a_photo</span>
<span class="font-label-md text-[10px] uppercase tracking-wider">Add</span>
</button>
<!-- Placeholder for added photo 1 -->
<div class="aspect-square rounded-xl bg-surface-container-high overflow-hidden relative shadow-[0_4px_20px_rgba(0,51,102,0.05)]">
<img alt="Close up of a leaking metal pipe joint" class="w-full h-full object-cover" data-alt="Close up of a leaking metal pipe joint with water droplets, clinical and clear lighting" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDhFADnrjydVqmhSKzXyJBKk4ToBn42YcFyWgaUtodmGXLFql-tD6rWrvbYuRUM6tta8qK2Qq33YTPRmMpfIbHlkhk2h-uXrGEK0wdSQL4R_rMsRJQ2CrGhmws74VkgFOKD7uxjJ4oy2csRzoM-4hJ3Ew1rW-rsyzrPSl1R5LWZcNY2aNZ0wXWJ2kdy-8dBptScKoCuB13w6X_ADMgcIOwoTkKhnWigtNMVY68x-ZxTkX8EWw7Cw8ui1AHK-xaegz9uffmXr_JkGfh1"/>
<button class="absolute top-1 right-1 bg-black/50 text-white rounded-full p-1 backdrop-blur-md" type="button">
<span class="material-symbols-outlined text-sm">close</span>
</button>
</div>
</div>
</section>
</form>
</main>
<!-- Sticky Bottom Submit Button -->
<div class="fixed bottom-0 w-full p-6 bg-white/80 backdrop-blur-xl border-t border-white/30 shadow-[0_-8px_30px_rgba(0,51,102,0.12)] z-40 max-w-2xl left-1/2 -translate-x-1/2">
<button class="w-full bg-primary text-on-primary py-4 rounded-xl font-label-md text-label-md text-lg shadow-[0_4px_20px_rgba(0,89,187,0.3)] active:scale-[0.98] transition-transform flex items-center justify-center gap-2" type="button">
            Submit ticket
            <span class="material-symbols-outlined">send</span>
</button>
</div>
</body></html>
